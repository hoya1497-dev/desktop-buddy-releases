<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>DesktopBuddyOverlay</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; user-select: none; }
    canvas { display: block; }
    [hidden] { display: none !important; }
    #chatBox {
      position: fixed; left: 0; top: 0; width: 240px; padding: 6px; background: #fff; border-radius: 14px;
      border: 1.5px solid rgba(0,0,0,.25); box-shadow: 0 6px 20px rgba(0,0,0,.18);
    }
    #chatBox::after {
      content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -7px;
      border: 7px solid transparent; border-top-color: #fff; border-bottom: 0;
    }
    #chatInput {
      width: 100%; box-sizing: border-box; border: 0; outline: none; font: 14px "Malgun Gothic","Apple SD Gothic Neo",sans-serif;
      padding: 6px 8px; background: #f4f2ef; border-radius: 9px; color: #222;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="chatBox" hidden><input id="chatInput" maxlength="200" placeholder="말하기… (Enter 보내기 · Esc 닫기)" autocomplete="off"></div>
  <script src="nickfx.js"></script>
  <script src="sprites.js"></script>
  <script src="skins.js"></script>
  <script src="petart.js"></script>
  <script src="emoteart.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
